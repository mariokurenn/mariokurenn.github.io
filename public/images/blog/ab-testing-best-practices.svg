<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f2419"/>
      <stop offset="100%" style="stop-color:#1a3d2b"/>
    </linearGradient>
    <linearGradient id="winnerBar" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#1A7F3C"/>
      <stop offset="100%" style="stop-color:#4ade80"/>
    </linearGradient>
    <linearGradient id="controlBar" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#374151"/>
      <stop offset="100%" style="stop-color:#6b7280"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="126" x2="1200" y2="126"/>
    <line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="378" x2="1200" y2="378"/>
    <line x1="0" y1="504" x2="1200" y2="504"/>
  </g>

  <!-- Divider line -->
  <line x1="600" y1="60" x2="600" y2="570" stroke="#4ade80" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="8,6"/>

  <!-- Version A label -->
  <rect x="140" y="60" width="120" height="40" rx="20" fill="#374151" opacity="0.8"/>
  <text x="200" y="86" font-family="system-ui,sans-serif" font-size="20" font-weight="900" fill="white" text-anchor="middle">Version A</text>

  <!-- Version B label -->
  <rect x="940" y="60" width="120" height="40" rx="20" fill="#1A7F3C" opacity="0.9"/>
  <text x="1000" y="86" font-family="system-ui,sans-serif" font-size="20" font-weight="900" fill="white" text-anchor="middle">Version B</text>

  <!-- A bars (control - grey) -->
  <g transform="translate(80, 140)">
    <rect x="0" y="100" width="70" height="190" rx="6" fill="url(#controlBar)" opacity="0.6"/>
    <rect x="90" y="80" width="70" height="210" rx="6" fill="url(#controlBar)" opacity="0.6"/>
    <rect x="180" y="60" width="70" height="230" rx="6" fill="url(#controlBar)" opacity="0.6"/>
    <rect x="270" y="50" width="70" height="240" rx="6" fill="url(#controlBar)" opacity="0.6"/>
    <text x="175" y="320" font-family="system-ui,sans-serif" font-size="28" font-weight="900" fill="#9ca3af" text-anchor="middle">2.1%</text>
    <text x="175" y="350" font-family="system-ui,sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">conversion rate</text>
  </g>

  <!-- B bars (variant - green) -->
  <g transform="translate(680, 140)">
    <rect x="0" y="30" width="70" height="260" rx="6" fill="url(#winnerBar)" opacity="0.8"/>
    <rect x="90" y="10" width="70" height="280" rx="6" fill="url(#winnerBar)" opacity="0.85"/>
    <rect x="180" y="0" width="70" height="290" rx="6" fill="url(#winnerBar)" opacity="0.9"/>
    <rect x="270" y="0" width="70" height="290" rx="6" fill="url(#winnerBar)"/>
    <text x="175" y="320" font-family="system-ui,sans-serif" font-size="28" font-weight="900" fill="#4ade80" text-anchor="middle">4.8%</text>
    <text x="175" y="350" font-family="system-ui,sans-serif" font-size="14" fill="#4ade80" text-anchor="middle">conversion rate</text>
  </g>

  <!-- Winner badge -->
  <rect x="860" y="470" width="200" height="50" rx="25" fill="#1A7F3C"/>
  <text x="960" y="502" font-family="system-ui,sans-serif" font-size="18" font-weight="800" fill="white" text-anchor="middle">+128% ↑ WINNER</text>

  <!-- Statistical significance note -->
  <rect x="400" y="530" width="400" height="36" rx="8" fill="#1A7F3C" opacity="0.2" stroke="#4ade80" stroke-width="1" stroke-opacity="0.3"/>
  <text x="600" y="554" font-family="system-ui,sans-serif" font-size="14" fill="#4ade80" text-anchor="middle" opacity="0.9">95% statistical significance · p &lt; 0.05</text>

  <!-- Labels -->
  <text x="80" y="603" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#4ade80" letter-spacing="3" opacity="0.9">GROW-CONVERSIONS.COM</text>
  <text x="1120" y="603" font-family="system-ui,sans-serif" font-size="28" font-weight="900" fill="white" text-anchor="end">A/B Testing Best Practices</text>
</svg>
