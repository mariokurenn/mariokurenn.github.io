<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="seo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f2419"/>
      <stop offset="100%" style="stop-color:#1a3d2b"/>
    </linearGradient>
    <linearGradient id="seo-cro-track" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1A7F3C"/>
      <stop offset="100%" style="stop-color:#4ade80"/>
    </linearGradient>
    <linearGradient id="seo-seo-track" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#seo-bg)"/>

  <!-- Grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="157" x2="1200" y2="157"/>
    <line x1="0" y1="314" x2="1200" y2="314"/>
    <line x1="0" y1="471" x2="1200" y2="471"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- ===== TIMELINE AXIS ===== -->
  <line x1="500" y1="420" x2="1160" y2="420" stroke="white" stroke-opacity="0.15" stroke-width="1.5"/>

  <!-- Month markers on axis -->
  <line x1="500" y1="415" x2="500" y2="428" stroke="white" stroke-opacity="0.3" stroke-width="1"/>
  <text x="500" y="444" font-family="system-ui,sans-serif" font-size="11" fill="white" opacity="0.4" text-anchor="middle">Now</text>

  <line x1="665" y1="415" x2="665" y2="428" stroke="white" stroke-opacity="0.2" stroke-width="1"/>
  <text x="665" y="444" font-family="system-ui,sans-serif" font-size="11" fill="white" opacity="0.35" text-anchor="middle">2 mo</text>

  <line x1="830" y1="415" x2="830" y2="428" stroke="white" stroke-opacity="0.2" stroke-width="1"/>
  <text x="830" y="444" font-family="system-ui,sans-serif" font-size="11" fill="white" opacity="0.35" text-anchor="middle">6 mo</text>

  <line x1="1000" y1="415" x2="1000" y2="428" stroke="white" stroke-opacity="0.2" stroke-width="1"/>
  <text x="1000" y="444" font-family="system-ui,sans-serif" font-size="11" fill="white" opacity="0.35" text-anchor="middle">12 mo</text>

  <line x1="1160" y1="415" x2="1160" y2="428" stroke="white" stroke-opacity="0.2" stroke-width="1"/>
  <text x="1160" y="444" font-family="system-ui,sans-serif" font-size="11" fill="white" opacity="0.35" text-anchor="middle">18 mo</text>

  <!-- ===== CRO TRACK (fast, steep, green) ===== -->
  <text x="500" y="248" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#4ade80" text-anchor="start" opacity="0.9">CRO — Fast track</text>

  <!-- CRO curve: steep climb early, plateaus -->
  <path d="M 500,420 C 540,380 580,310 650,270 S 750,255 1160,250"
    stroke="url(#seo-cro-track)" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- CRO shaded area -->
  <path d="M 500,420 C 540,380 580,310 650,270 S 750,255 1160,250 L 1160,420 Z"
    fill="#1A7F3C" opacity="0.12"/>

  <!-- CRO milestone dot: fast impact (8 weeks) -->
  <circle cx="665" cy="295" r="8" fill="#4ade80"/>
  <rect x="675" y="272" width="148" height="38" rx="6" fill="#1A7F3C" opacity="0.85" stroke="#4ade80" stroke-width="1" stroke-opacity="0.6"/>
  <text x="749" y="287" font-family="system-ui,sans-serif" font-size="11" fill="#4ade80" text-anchor="middle" font-weight="700">+68% CVR</text>
  <text x="749" y="302" font-family="system-ui,sans-serif" font-size="10" fill="white" text-anchor="middle" opacity="0.7">8 weeks</text>

  <!-- CRO end label -->
  <circle cx="1160" cy="250" r="10" fill="#4ade80"/>
  <rect x="1080" y="225" width="70" height="22" rx="5" fill="#4ade80" opacity="0.2"/>
  <text x="1115" y="240" font-family="system-ui,sans-serif" font-size="10" fill="#4ade80" text-anchor="middle" font-weight="700">REVENUE ↑</text>

  <!-- CRO label pill -->
  <rect x="500" y="255" width="60" height="24" rx="12" fill="#1A7F3C" stroke="#4ade80" stroke-width="1.5"/>
  <text x="530" y="271" font-family="system-ui,sans-serif" font-size="11" fill="#4ade80" text-anchor="middle" font-weight="700">CRO</text>

  <!-- ===== SEO TRACK (slow climb, blue) ===== -->
  <text x="500" y="395" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#60a5fa" text-anchor="start" opacity="0.75">SEO — Long game</text>

  <!-- SEO curve: slow, gradual, starts later -->
  <path d="M 500,420 C 560,418 650,415 750,400 S 920,360 1160,300"
    stroke="url(#seo-seo-track)" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8"/>

  <!-- SEO shaded area -->
  <path d="M 500,420 C 560,418 650,415 750,400 S 920,360 1160,300 L 1160,420 Z"
    fill="#1e3a5f" opacity="0.2"/>

  <!-- SEO milestone: kicks in at 6 months -->
  <circle cx="830" cy="400" r="7" fill="#3b82f6" opacity="0.8"/>
  <rect x="840" y="380" width="138" height="38" rx="6" fill="#1e3a5f" opacity="0.85" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.5"/>
  <text x="909" y="396" font-family="system-ui,sans-serif" font-size="11" fill="#60a5fa" text-anchor="middle" font-weight="700">Traffic starts</text>
  <text x="909" y="411" font-family="system-ui,sans-serif" font-size="10" fill="white" text-anchor="middle" opacity="0.6">~6 months</text>

  <!-- SEO end label -->
  <circle cx="1160" cy="300" r="8" fill="#3b82f6" opacity="0.8"/>

  <!-- SEO label pill -->
  <rect x="500" y="400" width="60" height="24" rx="12" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5" opacity="0.8"/>
  <text x="530" y="416" font-family="system-ui,sans-serif" font-size="11" fill="#60a5fa" text-anchor="middle" font-weight="700">SEO</text>

  <!-- Merge point label -->
  <rect x="1088" y="265" width="80" height="28" rx="8" fill="#0f2419" stroke="#4ade80" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="1128" y="283" font-family="system-ui,sans-serif" font-size="11" fill="white" text-anchor="middle" opacity="0.8">Both = 🚀</text>

  <!-- Y-axis label -->
  <text x="460" y="250" font-family="system-ui,sans-serif" font-size="11" fill="white" opacity="0.3" text-anchor="middle" transform="rotate(-90, 460, 335)">REVENUE</text>

  <!-- Left side comparison cards -->
  <rect x="60" y="100" width="170" height="70" rx="8" fill="#1A7F3C" opacity="0.25" stroke="#4ade80" stroke-width="1" stroke-opacity="0.4"/>
  <text x="145" y="122" font-family="system-ui,sans-serif" font-size="10" fill="#86efac" text-anchor="middle" letter-spacing="1">CRO TIME TO RESULTS</text>
  <text x="145" y="154" font-family="system-ui,sans-serif" font-size="26" font-weight="900" fill="#4ade80" text-anchor="middle">4–8 wks</text>

  <rect x="60" y="186" width="170" height="70" rx="8" fill="#1e3a5f" opacity="0.5" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.4"/>
  <text x="145" y="208" font-family="system-ui,sans-serif" font-size="10" fill="#93c5fd" text-anchor="middle" letter-spacing="1">SEO TIME TO RESULTS</text>
  <text x="145" y="240" font-family="system-ui,sans-serif" font-size="26" font-weight="900" fill="#60a5fa" text-anchor="middle">6–12 mo</text>

  <rect x="60" y="272" width="170" height="70" rx="8" fill="#1A7F3C" opacity="0.4" stroke="#4ade80" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="145" y="294" font-family="system-ui,sans-serif" font-size="10" fill="#86efac" text-anchor="middle" letter-spacing="1">RIGHT SEQUENCE</text>
  <text x="145" y="316" font-family="system-ui,sans-serif" font-size="16" font-weight="900" fill="white" text-anchor="middle">CRO → SEO</text>
  <text x="145" y="334" font-family="system-ui,sans-serif" font-size="12" fill="#4ade80" text-anchor="middle" opacity="0.8">Fix bucket first</text>

  <!-- Bottom text -->
  <text x="80" y="510" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#4ade80" letter-spacing="3" text-anchor="start" opacity="0.9">GROW-CONVERSIONS.COM</text>
  <text x="80" y="555" font-family="system-ui,sans-serif" font-size="34" font-weight="900" fill="white" text-anchor="start">CRO vs SEO: Which Should</text>
  <text x="80" y="600" font-family="system-ui,sans-serif" font-size="34" font-weight="900" fill="white" text-anchor="start">You Prioritize First?</text>
</svg>
