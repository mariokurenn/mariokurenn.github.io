<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bench-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f2419"/>
      <stop offset="100%" style="stop-color:#1a3d2b"/>
    </linearGradient>
    <linearGradient id="bench-bar-hi" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4ade80"/>
      <stop offset="100%" style="stop-color:#1A7F3C"/>
    </linearGradient>
    <linearGradient id="bench-bar-lo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d6a47"/>
      <stop offset="100%" style="stop-color:#1a3d2b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bench-bg)"/>

  <!-- Grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="157" x2="1200" y2="157"/>
    <line x1="0" y1="314" x2="1200" y2="314"/>
    <line x1="0" y1="471" x2="1200" y2="471"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Baseline -->
  <line x1="620" y1="420" x2="1160" y2="420" stroke="white" stroke-opacity="0.12" stroke-width="1"/>

  <!-- Horizontal grid lines for chart -->
  <line x1="620" y1="360" x2="1160" y2="360" stroke="white" stroke-opacity="0.06" stroke-width="1"/>
  <line x1="620" y1="300" x2="1160" y2="300" stroke="white" stroke-opacity="0.06" stroke-width="1"/>
  <line x1="620" y1="240" x2="1160" y2="240" stroke="white" stroke-opacity="0.06" stroke-width="1"/>
  <line x1="620" y1="180" x2="1160" y2="180" stroke="white" stroke-opacity="0.06" stroke-width="1"/>

  <!-- Bar: Travel 1.5% - height 60 -->
  <rect x="635" y="360" width="52" height="60" rx="4" fill="url(#bench-bar-lo)" opacity="0.6"/>
  <text x="661" y="350" font-family="system-ui,sans-serif" font-size="12" fill="white" opacity="0.5" text-anchor="middle">1.5%</text>
  <text x="661" y="440" font-family="system-ui,sans-serif" font-size="10" fill="white" opacity="0.45" text-anchor="middle">Travel</text>

  <!-- Bar: Electronics 1.2% - height 48 -->
  <rect x="702" y="372" width="52" height="48" rx="4" fill="url(#bench-bar-lo)" opacity="0.55"/>
  <text x="728" y="362" font-family="system-ui,sans-serif" font-size="12" fill="white" opacity="0.5" text-anchor="middle">1.2%</text>
  <text x="728" y="440" font-family="system-ui,sans-serif" font-size="10" fill="white" opacity="0.45" text-anchor="middle">Electronics</text>

  <!-- Bar: Real Estate 2% - height 80 -->
  <rect x="769" y="340" width="52" height="80" rx="4" fill="url(#bench-bar-lo)" opacity="0.7"/>
  <text x="795" y="330" font-family="system-ui,sans-serif" font-size="12" fill="white" opacity="0.55" text-anchor="middle">2.0%</text>
  <text x="795" y="440" font-family="system-ui,sans-serif" font-size="10" fill="white" opacity="0.45" text-anchor="middle">Real Estate</text>

  <!-- Bar: B2B 2.5% - height 100 -->
  <rect x="836" y="320" width="52" height="100" rx="4" fill="url(#bench-bar-lo)" opacity="0.75"/>
  <text x="862" y="310" font-family="system-ui,sans-serif" font-size="12" fill="white" opacity="0.6" text-anchor="middle">2.5%</text>
  <text x="862" y="440" font-family="system-ui,sans-serif" font-size="10" fill="white" opacity="0.45" text-anchor="middle">B2B</text>

  <!-- Bar: SaaS 4% - height 160 -->
  <rect x="903" y="260" width="52" height="160" rx="4" fill="url(#bench-bar-lo)" opacity="0.85"/>
  <text x="929" y="250" font-family="system-ui,sans-serif" font-size="12" fill="white" opacity="0.65" text-anchor="middle">4.0%</text>
  <text x="929" y="440" font-family="system-ui,sans-serif" font-size="10" fill="white" opacity="0.45" text-anchor="middle">SaaS</text>

  <!-- Bar: Finance 5.5% - height 220 — HIGHLIGHTED -->
  <rect x="970" y="200" width="52" height="220" rx="4" fill="url(#bench-bar-hi)"/>
  <text x="996" y="190" font-family="system-ui,sans-serif" font-size="14" font-weight="800" fill="#4ade80" text-anchor="middle">5.5%</text>
  <text x="996" y="440" font-family="system-ui,sans-serif" font-size="10" fill="#4ade80" opacity="0.9" text-anchor="middle">Finance</text>
  <!-- Star on top bar -->
  <text x="996" y="215" font-family="system-ui,sans-serif" font-size="14" fill="white" opacity="0.9" text-anchor="middle">★</text>

  <!-- Bar: Food 4.5% - height 180 -->
  <rect x="1037" y="240" width="52" height="180" rx="4" fill="url(#bench-bar-lo)" opacity="0.85"/>
  <text x="1063" y="230" font-family="system-ui,sans-serif" font-size="12" fill="white" opacity="0.65" text-anchor="middle">4.5%</text>
  <text x="1063" y="440" font-family="system-ui,sans-serif" font-size="10" fill="white" opacity="0.45" text-anchor="middle">Food</text>

  <!-- Industry avg line -->
  <line x1="620" y1="320" x2="1160" y2="320" stroke="#facc15" stroke-width="1.5" stroke-dasharray="8,5" opacity="0.5"/>
  <text x="625" y="315" font-family="system-ui,sans-serif" font-size="10" fill="#facc15" opacity="0.7">Avg 2.35%</text>

  <!-- Left side stat cards -->
  <rect x="60" y="100" width="160" height="58" rx="8" fill="#1A7F3C" opacity="0.25" stroke="#4ade80" stroke-width="1" stroke-opacity="0.3"/>
  <text x="140" y="122" font-family="system-ui,sans-serif" font-size="11" fill="#86efac" text-anchor="middle">Industries Tracked</text>
  <text x="140" y="147" font-family="system-ui,sans-serif" font-size="26" font-weight="900" fill="white" text-anchor="middle">14</text>

  <rect x="60" y="174" width="160" height="58" rx="8" fill="#1A7F3C" opacity="0.25" stroke="#4ade80" stroke-width="1" stroke-opacity="0.3"/>
  <text x="140" y="196" font-family="system-ui,sans-serif" font-size="11" fill="#86efac" text-anchor="middle">Sessions Analysed</text>
  <text x="140" y="221" font-family="system-ui,sans-serif" font-size="22" font-weight="900" fill="white" text-anchor="middle">150M+</text>

  <rect x="60" y="248" width="160" height="58" rx="8" fill="#1A7F3C" opacity="0.4" stroke="#4ade80" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="140" y="270" font-family="system-ui,sans-serif" font-size="11" fill="#86efac" text-anchor="middle">Top Quartile</text>
  <text x="140" y="296" font-family="system-ui,sans-serif" font-size="26" font-weight="900" fill="#4ade80" text-anchor="middle">5.31%+</text>

  <!-- Bottom text -->
  <text x="80" y="510" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#4ade80" letter-spacing="3" text-anchor="start" opacity="0.9">GROW-CONVERSIONS.COM</text>
  <text x="80" y="555" font-family="system-ui,sans-serif" font-size="34" font-weight="900" fill="white" text-anchor="start">Conversion Rate Benchmarks</text>
  <text x="80" y="600" font-family="system-ui,sans-serif" font-size="34" font-weight="900" fill="white" text-anchor="start">by Industry [2026]</text>
</svg>
