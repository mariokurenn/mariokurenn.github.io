    <rect x="36" y="310" width="60" height="10" rx="2" fill="#4ade80" opacity="0.6"/>
    <rect x="36" y="328" width="120" height="8" rx="2" fill="#374151"/>
    <rect x="36" y="342" width="110" height="8" rx="2" fill="#374151"/>
    <rect x="36" y="356" width="125" height="8" rx="2" fill="#374151"/>
    <rect x="36" y="378" width="80" height="28" rx="6" fill="#1A7F3C" opacity="0.7"/>
    <rect x="200" y="296" width="158" height="140" rx="6" fill="#1f2937"/>
    <rect x="216" y="310" width="60" height="10" rx="2" fill="#4ade80" opacity="0.6"/>
    <rect x="216" y="328" width="120" height="8" rx="2" fill="#374151"/>
    <rect x="216" y="342" width="110" height="8" rx="2" fill="#374151"/>
    <rect x="216" y="356" width="125" height="8" rx="2" fill="#374151"/>
    <rect x="216" y="378" width="80" height="28" rx="6" fill="#1A7F3C" opacity="0.7"/>
    <rect x="380" y="296" width="180" height="140" rx="6" fill="#1f2937"/>
    <rect x="396" y="310" width="60" height="10" rx="2" fill="#4ade80" opacity="0.6"/>
    <rect x="396" y="328" width="130" height="8" rx="2" fill="#374151"/>
    <rect x="396" y="342" width="110" height="8" rx="2" fill="#374151"/>
    <rect x="396" y="356" width="140" height="8" rx="2" fill="#374151"/>
    <rect x="396" y="378" width="80" height="28" rx="6" fill="#1A7F3C" opacity="0.7"/>
