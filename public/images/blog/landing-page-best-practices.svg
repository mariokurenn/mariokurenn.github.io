      <text x="14" y="19" font-family="system-ui,sans-serif" font-size="14" font-weight="900" fill="white" text-anchor="middle">✓</text>
      <text x="40" y="19" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="white" opacity="0.9">Social proof above fold</text>
    </g>
    <g transform="translate(0, 190)">
      <circle cx="14" cy="14" r="14" fill="#1A7F3C" opacity="0.9"/>
      <text x="14" y="19" font-family="system-ui,sans-serif" font-size="14" font-weight="900" fill="white" text-anchor="middle">✓</text>
      <text x="40" y="19" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="white" opacity="0.9">No navigation distraction</text>
    </g>
    <g transform="translate(0, 235)">
      <circle cx="14" cy="14" r="14" fill="#1A7F3C" opacity="0.9"/>
      <text x="14" y="19" font-family="system-ui,sans-serif" font-size="14" font-weight="900" fill="white" text-anchor="middle">✓</text>
      <text x="40" y="19" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="white" opacity="0.9">Mobile-first layout</text>
    </g>
    <g transform="translate(0, 280)">
      <circle cx="14" cy="14" r="14" fill="#1A7F3C" opacity="0.9"/>
      <text x="14" y="19" font-family="system-ui,sans-serif" font-size="14" font-weight="900" fill="white" text-anchor="middle">✓</text>
      <text x="40" y="19" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="white" opacity="0.9">Trust signals at CTA</text>
