<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f2419"/>
      <stop offset="100%" style="stop-color:#1a3d2b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1A7F3C"/>
      <stop offset="100%" style="stop-color:#4ade80"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="157" x2="1200" y2="157"/>
    <line x1="0" y1="314" x2="1200" y2="314"/>
    <line x1="0" y1="471" x2="1200" y2="471"/>
  </g>

  <!-- Landing page wireframe mockup -->
  <g transform="translate(580, 50)">
    <!-- Browser chrome -->
    <rect x="0" y="0" width="580" height="480" rx="12" fill="#111827" stroke="#374151" stroke-width="1.5"/>
    <!-- URL bar -->
    <rect x="16" y="14" width="548" height="22" rx="4" fill="#1f2937"/>
    <circle cx="30" cy="25" r="5" fill="#374151"/>
    <circle cx="48" cy="25" r="5" fill="#374151"/>
    <circle cx="66" cy="25" r="5" fill="#374151"/>
    <rect x="85" y="18" width="460" height="14" rx="3" fill="#374151"/>
    <!-- Nav -->
    <rect x="0" y="48" width="580" height="36" fill="#1f2937"/>
    <rect x="16" y="58" width="60" height="16" rx="3" fill="#374151"/>
    <rect x="200" y="58" width="45" height="16" rx="3" fill="#374151" opacity="0.7"/>
    <rect x="260" y="58" width="55" height="16" rx="3" fill="#374151" opacity="0.7"/>
    <rect x="330" y="58" width="40" height="16" rx="3" fill="#374151" opacity="0.7"/>
    <rect x="490" y="54" width="74" height="24" rx="12" fill="#1A7F3C" opacity="0.9"/>
    <!-- Hero -->
    <rect x="0" y="84" width="580" height="160" fill="#1f2937"/>
    <!-- Hero headline lines -->
    <rect x="40" y="106" width="320" height="20" rx="3" fill="#4ade80" opacity="0.8"/>
    <rect x="40" y="134" width="280" height="16" rx="3" fill="#6b7280" opacity="0.6"/>
    <rect x="40" y="158" width="240" height="16" rx="3" fill="#6b7280" opacity="0.5"/>
