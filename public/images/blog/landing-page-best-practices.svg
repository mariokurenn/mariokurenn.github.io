  <!-- Bottom text -->
  <text x="60" y="603" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#4ade80" letter-spacing="3" opacity="0.9">GROW-CONVERSIONS.COM</text>
  <text x="1140" y="595" font-family="system-ui,sans-serif" font-size="30" font-weight="900" fill="white" text-anchor="end">Landing Page</text>
  <text x="1140" y="625" font-family="system-ui,sans-serif" font-size="30" font-weight="900" fill="white" text-anchor="end">Best Practices</text>
</svg>
