    <rect x="40" y="184" width="160" height="40" rx="8" fill="url(#accent)" opacity="0.7"/>
    <!-- Trust signal -->
    <text x="40" y="246" font-family="system-ui,sans-serif" font-size="10" fill="#4ade80" opacity="0.7">★★★★★  4.9/5 · 47 reviews</text>
    <!-- Right image placeholder -->
    <rect x="360" y="92" width="196" height="144" rx="6" fill="#374151" opacity="0.6"/>
    <text x="458" y="168" font-family="system-ui,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">hero image</text>
    <!-- Logo bar -->
    <rect x="0" y="244" width="580" height="40" fill="#111827" stroke-top="#374151"/>
    <rect x="60" y="255" width="60" height="18" rx="3" fill="#374151" opacity="0.5"/>
    <rect x="160" y="255" width="70" height="18" rx="3" fill="#374151" opacity="0.5"/>
    <rect x="280" y="255" width="50" height="18" rx="3" fill="#374151" opacity="0.5"/>
    <rect x="380" y="255" width="65" height="18" rx="3" fill="#374151" opacity="0.5"/>
    <rect x="490" y="255" width="45" height="18" rx="3" fill="#374151" opacity="0.5"/>
    <!-- Content section -->
