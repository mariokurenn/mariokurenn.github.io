  <!-- Left content: checklist style -->
  <g transform="translate(60, 100)">
    <text x="0" y="30" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#4ade80" letter-spacing="3" opacity="0.9">LANDING PAGE AUDIT</text>

    <!-- Checklist items -->
    <g transform="translate(0, 55)">
      <circle cx="14" cy="14" r="14" fill="#1A7F3C" opacity="0.9"/>
      <text x="14" y="19" font-family="system-ui,sans-serif" font-size="14" font-weight="900" fill="white" text-anchor="middle">✓</text>
      <text x="40" y="19" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="white" opacity="0.9">Clear value proposition</text>
    </g>
    <g transform="translate(0, 100)">
      <circle cx="14" cy="14" r="14" fill="#1A7F3C" opacity="0.9"/>
